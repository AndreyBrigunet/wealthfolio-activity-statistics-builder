name: Release add-on

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath manifest.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"

          if ($manifest.version -ne $package.version) {
            throw "Version mismatch: package.json is $($package.version), manifest.json is $($manifest.version)."
          }

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag mismatch: expected '$expectedTag', received '$env:RELEASE_TAG'."
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Validate manifest
        run: pnpm validate:manifest

      - name: Build installable archive
        run: pnpm bundle

      - name: Generate checksum
        id: artifacts
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $archiveName = "$($package.name)-$($package.version).zip"
          $archivePath = Join-Path dist $archiveName

          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Release archive was not generated: $archivePath"
          }

          $checksumPath = "$archivePath.sha256"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $archiveName`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )

          "RELEASE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:RELEASE_ARCHIVE `
            $env:RELEASE_CHECKSUM `
            --verify-tag `
            --title "Activity Statistics Builder $env:RELEASE_TAG" `
            --generate-notes
